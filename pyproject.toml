[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexpay-fintech"
version = "1.0.0"
description = "Enterprise Fintech Core Ledger, Payment Processing, Compliance & Credit Engine"
authors = [{ name = "ApexPay Engineering Team", email = "engineering@apexpay.io" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "pytest>=7.4.0",
    "httpx>=0.24.0",
    "cryptography>=41.0.0",
    "python-jose>=3.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
